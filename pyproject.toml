[project]
name = "zitcompiler"
version = "0.1.0"
description = "A Zig zust-in-time compiler for Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ziglang"]

[project.optional-dependencies]
cli = ["click"]
tests = ["pytest"]
benchmarks = ["pytest-benchmark", "rich"]

[project.scripts]
zit = "zitcompiler.cli:zit"
