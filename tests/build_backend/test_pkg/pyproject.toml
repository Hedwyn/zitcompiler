[project]
name = "greetings"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["zitcompiler"]

[build-system]
requires = ["hatchling", "zitcompiler"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greetings"]

[tool.hatch.build.hooks.zitcompiler]
module = "greetings"

[tool.uv.sources]
zitcompiler = { path = "../../..", editable = true }
